# electron-builder config — wave 1: Windows + Linux only (PRD §4, desktop-first).
# macOS intentionally NOT configured; scripts/validate-builder-config.mjs enforces this.
# NOTE: not executed in wave 1 (CI runs vite builds only); this file is scaffold + future packaging contract.
appId: chat.linnet.desktop
productName: Linnet
# electron must not derive it from the scoped npm name (@linnet/desktop -> "@linnetdesktop")
executableName: linnet
copyright: "Copyright (C) Linnet contributors — AGPL-3.0-only"

directories:
  output: dist

files:
  - dist-electron/**
  - package.json
  # W12a: runtime BrowserWindow icon for Linux (asar must carry it; the
  # build/icons tree is consumed by electron-builder itself, not shipped)
  - build/icon.png

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# W18: electron-updater metadata (latest.yml / latest-linux.yml) is generated
# against this GitHub repo and read back by apps/desktop/src/updater.ts from
# the packaged app-update.yml. Forks repoint via config.json `updateRepo`
# (the Tier-1 check) — Tier-2 metadata is baked at build time.
publish:
  provider: github
  owner: ct06033
  repo: linnet

extraResources:
  - from: ../../packages/app/dist
    to: renderer
  # config.json deployment: drop <resourcesPath>/config.json (see docs/config.md)

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - deb
    - rpm
    - AppImage
  category: Network
  maintainer: Linnet contributors
  synopsis: Matrix chat client between Element and Cinny
  # W12a FIX (missing launcher icon): the Linux icon-set resolver only reads
  # build/icons/{N}.png — flat build/icon-16.png names are ignored and only a
  # lone icon.png got installed at hicolor/512x512. Explicit dir keeps every
  # size (16..512, generated by scripts/gen-linux-icons.mjs) in the package.
  icon: build/icons
  # W12a: .desktop filename/StartupWMClass follow package.json desktopName
  # ("linnet.desktop") so Electron's app_id == WM_CLASS == Icon= ==
  # executableName — GNOME can associate the running window with the entry.
  syncDesktopName: true
